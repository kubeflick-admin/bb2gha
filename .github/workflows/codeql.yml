# ---------------------------------------------------------------
# SAST: CodeQL scans the Python source for security bugs
# (injection, unsafe deserialization, etc.). Free on public repos.
# ---------------------------------------------------------------
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"    # weekly Monday scan: catches new CVE rules on unchanged code.

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none      # Python is interpreted; nothing to compile
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-python
