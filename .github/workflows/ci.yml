# ---------------------------------------------------------------
# CI: lint, test, build image, scan image. Runs on every push and PR.
# Phase 1 = migrated from bitbucket-pipelines.yml
# Phase 2 = added Trivy image scan as a quality gate
# ---------------------------------------------------------------
name: CI

on:
  push:
  pull_request:
    branches: [main]

# Least privilege by default; jobs ask for more only if they need it.
permissions:
  contents: read

# Cancel older runs on the same branch when you push again (saves minutes = FinOps)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write    # needed to upload results to the Security tab
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t bb2gha:${{ github.sha }} .

      # Third-party action: in a real platform, pin to a full commit SHA
      # (see README "Supply chain" notes). Tag shown here for readability.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bb2gha:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true    # only fail on CVEs that have a fix available
          exit-code: "1"          # <- this makes it a quality GATE, not just a report

      - name: Upload scan results to GitHub Security tab
        if: always()              # upload even when the scan failed the job
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
