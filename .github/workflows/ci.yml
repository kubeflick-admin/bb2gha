# ---------------------------------------------------------------
# "AFTER" state: the same pipeline, migrated to GitHub Actions.
# Compare side by side with bitbucket-pipelines.yml.
# ---------------------------------------------------------------
name: CI

on:
  push:                       # = Bitbucket "default" (every branch)
  pull_request:
    branches: [main]

# Least privilege for the auto-generated GITHUB_TOKEN (security interview point)
permissions:
  contents: read

jobs:
  lint-test:                  # = the &lint-test anchor in Bitbucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip          # = Bitbucket "caches: - pip"

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker-build:
    needs: lint-test          # runs only if tests pass (a quality gate)
    if: github.ref == 'refs/heads/main'   # = Bitbucket "branches: main"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker is pre-installed on GitHub runners - no "services: docker" needed
      - run: docker build -t bb2gha:${{ github.sha }} .
